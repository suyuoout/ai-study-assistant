name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 说明：默认跳过测试以保证流水线稳定；本地/CI 想跑测试可去掉 -DskipTests
      - name: Build backend
        run: mvn -B -f study-assisiant/pom.xml clean package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-assisiant-web/package-lock.json

      - name: Build frontend
        working-directory: study-assisiant-web
        run: |
          npm ci
          npm run build
