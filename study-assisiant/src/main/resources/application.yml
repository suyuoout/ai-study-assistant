ai:
  api-key: ${DEEPSEEK_API_KEY:}
  url: ${AI_BASE_URL:https://api.deepseek.com/chat/completions}

server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: study-assisiant
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:h2:file:${user.home}/.study-assistant/data/study_assistant;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:study-assistant-dev-secret-please-change}

app:
  upload-dir: ${UPLOAD_DIR:${user.home}/.study-assistant/uploads}
  allow-register: ${ALLOW_REGISTER:true}
