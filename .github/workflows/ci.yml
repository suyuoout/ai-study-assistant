name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 测试使用内存 H2，不需要外部 MySQL
      - name: Build & test
        run: mvn -B -f study-assisiant/pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: study-assisiant/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-assisiant-web/package-lock.json

      - name: Install dependencies
        working-directory: study-assisiant-web
        run: npm ci

      - name: Lint
        working-directory: study-assisiant-web
        run: npm run lint

      - name: Unit tests
        working-directory: study-assisiant-web
        run: npm run test

      - name: Type check & build
        working-directory: study-assisiant-web
        run: npm run build
