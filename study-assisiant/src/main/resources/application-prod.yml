# 生产环境：MySQL + 全部密钥走环境变量（不包含任何明文密钥）
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/study_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 缺失时由 EnvironmentValidator 给出可读的中文提示，而不是占位符解析异常
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

ai:
  # 允许为空：用户可以在「个人中心」配置自己的 Key，此时系统 Key 仅用于兜底
  api-key: ${DEEPSEEK_API_KEY:}
  url: ${AI_BASE_URL:https://api.deepseek.com/chat/completions}
  model: ${AI_MODEL:deepseek-chat}
  temperature: ${AI_TEMPERATURE:0.7}
  max-tokens: ${AI_MAX_TOKENS:8192}
  connect-timeout-seconds: ${AI_CONNECT_TIMEOUT:30}
  read-timeout-seconds: ${AI_READ_TIMEOUT:120}

jwt:
  secret: ${JWT_SECRET:}
  expire-minutes: ${JWT_EXPIRE_MINUTES:120}

app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  allow-register: ${ALLOW_REGISTER:true}
  ai-daily-limit: ${AI_DAILY_LIMIT:50}
  # 建议显式提供：个人 AI Key 的加密密钥；缺失时回退用 JWT_SECRET 派生并打印告警
  crypto-key: ${CRYPTO_KEY:}
  bootstrap-admin: ${BOOTSTRAP_ADMIN:false}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
  async-parse: ${ASYNC_PARSE:true}
  user-cache-seconds: ${USER_CACHE_SECONDS:60}
  login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
  login-lock-minutes: ${LOGIN_LOCK_MINUTES:10}

logging:
  level:
    root: info
    com.study.assisiant: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
